<title>Jump Jump Jimbo and Friends</title>
<style>
:root{--bs:clamp(72px,22vw,108px);--ctrlH:calc(var(--bs) + 26px + env(safe-area-inset-bottom));--txt:#f4f6ff;--hi:#ffd21e;--blue:#2b44e8}
#app.big{--bs:clamp(92px,28vw,132px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top)}
#stage{position:relative;width:min(100vw,576px);flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#ctrl{display:none;width:min(100vw,576px);height:var(--ctrlH);flex:0 0 auto;background:#0a0f3a;border-top:4px solid #000;box-shadow:inset 0 4px 0 #3a4ad0,inset 0 8px 0 #1a2590;padding:10px 16px calc(10px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;touch-action:none}
#app.playing #ctrl{display:flex}
#hud{flex:0 0 auto;width:120px;height:75px;image-rendering:pixelated;pointer-events:none}
.cbtn{position:relative;width:var(--bs);height:var(--bs);padding:0;margin:0;border:0;background:transparent;touch-action:none;display:block;flex:none;outline:none}
.cbtn::before{content:"";position:absolute;inset:-14px}
.cbtn canvas{width:100%;height:100%;image-rendering:pixelated;pointer-events:none;display:block}
.cbtn .dn{display:none}.cbtn.down .up{display:none}.cbtn.down .dn{display:block}
#pauseBtn{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;padding:0;background:transparent;display:none;z-index:5;touch-action:manipulation}
#pauseBtn canvas{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#app.playing #pauseBtn{display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:6}
.screen{position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:calc(10px + env(safe-area-inset-top)) 12px 14px;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}
.screen.dim{background:rgba(3,5,25,.86)}
.screen.dimlite{background:rgba(3,5,25,.55)}
.panel{background:#0a0f3a;box-shadow:0 0 0 3px #000,inset 0 0 0 3px #3a4ad0,inset 0 0 0 6px #0a0f3a;padding:16px;margin:6px 4px}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}.center{text-align:center;justify-content:center}
.pb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 12px;border:0;border-radius:0;background:var(--blue);color:#fff;font:900 14px/1 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;box-shadow:0 0 0 3px #000,inset 0 3px 0 #7d8dff,inset 0 -4px 0 #1424a0;margin:3px;touch-action:manipulation}
.pb:active,.pb.act{transform:translateY(2px)}
.pb.pri{background:#ffb800;color:#000;box-shadow:0 0 0 3px #000,inset 0 3px 0 #ffe27a,inset 0 -4px 0 #c07800}
.pb.red{background:#e0303f;box-shadow:0 0 0 3px #000,inset 0 3px 0 #ff8a92,inset 0 -4px 0 #8a1020}
.pb.sel{background:#16a34a;box-shadow:0 0 0 3px #000,inset 0 3px 0 #7dffa8,inset 0 -4px 0 #0a6a30}
.pb img,.hd img{image-rendering:pixelated;display:block}
.pb.small{min-height:38px;padding:6px 8px;font-size:12px}
.hd{display:flex;justify-content:center;margin:6px 0 10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back{width:46px;height:46px;flex:none;padding:0;margin:3px}
p,li,label,td,th,.txt{font-size:14px;line-height:1.45}
.dimtxt{color:#9fb0ff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.charb{position:relative;padding:6px 2px 4px;background:#141c64;border:0;color:#fff;font:800 11px/1.1 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #2a3ab0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.charb canvas{width:72px;height:72px;image-rendering:pixelated}
.charb.sel{background:#1f3a9a;box-shadow:0 0 0 3px #000,0 0 0 6px #ffd21e,0 0 18px 6px rgba(255,210,30,.6),inset 0 0 0 2px #ffd21e}
.card{position:relative;padding:0;border:0;background:#000;cursor:pointer;box-shadow:0 0 0 3px #000;color:#fff;display:flex;flex-direction:column;text-align:left}
.card canvas{width:100%;display:block;image-rendering:pixelated}
.card .cap{padding:6px 8px 8px;background:#10185a;font:800 12px/1.3 ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card.sel{box-shadow:0 0 0 3px #000,0 0 0 6px #ffd21e,0 0 18px 6px rgba(255,210,30,.6)}
.badge{width:22px;height:26px;image-rendering:pixelated}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 3px;text-align:left;font-size:12px;white-space:nowrap}
th{color:#ffd21e;border-bottom:2px solid #3a4ad0}
tr:nth-child(even) td{background:rgba(255,255,255,.05)}
td.r,th.r{text-align:right}
.set h3{margin:12px 0 6px;font:900 13px ui-monospace,Menlo,Consolas,monospace;color:#ffd21e;letter-spacing:1px}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.set input[type=range]{width:46%;accent-color:#ffd21e;height:28px}
.set input[type=checkbox]{width:26px;height:26px;accent-color:#16a34a}
.seg{display:flex}.seg .pb{margin:0 2px;min-height:36px;padding:4px 10px;font-size:12px}
input.name{width:100%;font:800 18px ui-monospace,Menlo,Consolas,monospace;padding:10px;background:#000;color:#ffd21e;border:3px solid #3a4ad0;border-radius:0;-webkit-user-select:text;user-select:text}

#dbg{position:absolute;left:4px;bottom:4px;margin:0;z-index:11;font:10px/1.2 ui-monospace,Menlo,monospace;color:#7dff9a;background:rgba(0,0,0,.7);padding:4px;pointer-events:none;display:none;white-space:pre}
#rotate{position:fixed;inset:0;z-index:50;background:#05060f;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
.shoprow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.shoprow .ic{flex:0 0 66px;height:54px;display:flex;align-items:center;justify-content:center;background:#0a0f3a;box-shadow:0 0 0 2px #3a4ad0}

.tabs{display:flex;gap:8px}.tabs .pb{flex:1}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}

.medals{display:flex;gap:8px;align-items:center;justify-content:center}

.modal.on{display:flex}
.modal .panel{width:100%;max-width:340px}
